name: Refresh Capital Trace Broad S&P 500

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: capital-trace-broad-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Capital Trace broad S&P 500 records
        env:
          CAPITAL_TRACE_REFRESH_SCOPE: "broad"
          CAPITAL_TRACE_ISSUER_WATCHLIST_MODE: "sp500"

          # Use SEC index/full-index discovery path instead of company-by-company hammering.
          CAPITAL_TRACE_USE_INDEX_SCAN: "true"
          CAPITAL_TRACE_INDEX_SCAN_REPLACES_ISSUER_LANES: "true"
          CAPITAL_TRACE_USE_FULL_INDEX_FIRST: "true"
          CAPITAL_TRACE_DISABLE_DAILY_INDEX_FALLBACK: "true"

          # Broad scan settings.
          CAPITAL_TRACE_LOOKBACK_DAYS: "180"
          CAPITAL_TRACE_INDEX_LOOKBACK_DAYS: "14"
          CAPITAL_TRACE_INDEX_MAX_DAYS: "14"
          CAPITAL_TRACE_MAX_ISSUERS_PER_RUN: "75"
          CAPITAL_TRACE_MAX_FORM4_PER_COMPANY: "100"
          CAPITAL_TRACE_MAX_OUTPUT_RECORDS: "5000"

          # Keep 13F off in broad scan until the SEC access path is stable.
          CAPITAL_TRACE_RUN_13F: "false"

          # SEC access safety.
          CAPITAL_TRACE_SEC_REQUEST_DELAY_SECONDS: "1.5"
          CAPITAL_TRACE_SEC_MAX_403_ERRORS: "10"
          CAPITAL_TRACE_FAIL_ON_SEC_BLOCK: "true"
          CAPITAL_TRACE_DISABLE_OWNERSHIP_BROWSE_FALLBACK: "true"
          CAPITAL_TRACE_USER_AGENT: "Edgefield Systems LLC rutenmeister@users.noreply.github.com"

          # Data safety.
          CAPITAL_TRACE_EMPTY_DATA_GUARD: "true"
          CAPITAL_TRACE_MERGE_PREVIOUS_RECORDS: "true"

        run: python scripts/refresh_capital_trace.py

      - name: Audit generated data integrity
        env:
          CAPITAL_TRACE_FAIL_ON_SEC_BLOCK: "true"
        run: python scripts/audit_data_integrity.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh Capital Trace broad S&P 500 SEC data"
          file_pattern: data/capital_trace.json
