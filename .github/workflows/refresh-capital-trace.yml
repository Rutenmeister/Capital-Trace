name: Refresh Capital Trace

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: capital-trace-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Capital Trace records
        env:
          CAPITAL_TRACE_LOOKBACK_DAYS: "180"
          CAPITAL_TRACE_MAX_FORM4_PER_COMPANY: "100"
          CAPITAL_TRACE_MAX_OUTPUT_RECORDS: "5000"
          CAPITAL_TRACE_USER_AGENT: "CapitalTrace/0.12i rutenmeister@users.noreply.github.com"
          CAPITAL_TRACE_EMPTY_DATA_GUARD: "true"
          CAPITAL_TRACE_ISSUER_WATCHLIST_MODE: "sp500"
        run: python scripts/refresh_capital_trace.py

      - name: Audit generated data integrity
        run: python scripts/audit_data_integrity.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh Capital Trace with S&P 500 SEC pull and 13F implied-price repair"
          file_pattern: data/capital_trace.json
