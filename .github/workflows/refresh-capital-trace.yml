name: Refresh Capital Trace Fast Core

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: capital-trace-fast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Capital Trace fast core records
        env:
          CAPITAL_TRACE_REFRESH_SCOPE: "core"
          CAPITAL_TRACE_ISSUER_WATCHLIST_MODE: "core"
          CAPITAL_TRACE_USE_INDEX_SCAN: "true"
          CAPITAL_TRACE_INDEX_SCAN_REPLACES_ISSUER_LANES: "true"
          CAPITAL_TRACE_INDEX_LOOKBACK_DAYS: "14"
          CAPITAL_TRACE_INDEX_MAX_DAYS: "14"
          CAPITAL_TRACE_RUN_13F: "false"
          CAPITAL_TRACE_LOOKBACK_DAYS: "180"
          CAPITAL_TRACE_MAX_ISSUERS_PER_RUN: "50"
          CAPITAL_TRACE_MAX_FORM4_PER_COMPANY: "100"
          CAPITAL_TRACE_MAX_OUTPUT_RECORDS: "5000"
          CAPITAL_TRACE_SEC_REQUEST_DELAY_SECONDS: "0.75"
          CAPITAL_TRACE_SEC_MAX_403_ERRORS: "10"
          CAPITAL_TRACE_EMPTY_DATA_GUARD: "true"
          CAPITAL_TRACE_MERGE_PREVIOUS_RECORDS: "true"
          CAPITAL_TRACE_USER_AGENT: "CapitalTrace/0.12k rutenmeister@users.noreply.github.com"
        run: python scripts/refresh_capital_trace.py

      - name: Audit generated data integrity
        run: python scripts/audit_data_integrity.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh Capital Trace fast core SEC index data"
          file_pattern: data/capital_trace.json
